services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: fin_db
    restart: always
    environment:
      POSTGRES_DB: financedata
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 5431:5432
    volumes:
      - ./db_script.sql:/docker-entrypoint-initdb.d/db_script.sql
      - timescaledb:/var/lib/postgresql/data
    networks:
      - fin_net

  option_fetcher:
    build: .
    depends_on:
      - timescaledb
    networks:
      - fin_net

  sentiment_fetcher:
    build:
      context: .
      dockerfile: sentiment.Dockerfile
    depends_on:
      - timescaledb
    networks:
      - fin_net

volumes:
  timescaledb:

networks:
  fin_net:
