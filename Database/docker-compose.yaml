services:
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: database
    restart: always
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - 5432:5432
    volumes:
      - ./db_script.sql:/docker-entrypoint-initdb.d/db_script.sql
      - timescaledb:/var/lib/postgresql/data

